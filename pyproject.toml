[project]
name = "kestra-pipeline"
version = "0.1.0"
description = "Kestra pipeline for FileNest and Nodule Spotter"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name="Logid Hasan", email="logidhasan@example.com"}]
license = {text = "MIT"}
dependencies = [
    "kestra",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
    "openai",
    "httpx",
    "Pillow",
    "numpy<2.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "huggingface-hub>=0.23",
    "torch",
    "torchvision",
    "mmengine==0.10.7",
    "mmcv==2.1.0",
    "mmdet==3.3.0",
    "pycocotools>=2.0.7",
    "litellm>=1.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
