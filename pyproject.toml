[project]
name = "kestra-pipeline"
version = "0.1.0"
description = "Kestra pipeline for FileNest development"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name="Logid Hasan", email="logidhasan@example.com"}]
license = {text = "MIT"}

[project.dependencies]
kestra = "*"
pydantic = ">=2.0"
pydantic-settings = "*"
python-dotenv = "*"
openai = "*"
httpx = "*"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

